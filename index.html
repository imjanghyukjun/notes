<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jang Hyukjun</title>
  <style>
    /* 기본 스타일 초기화 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      color: #000;
      overflow: hidden;
    }

    /* 상단 헤더 */
    .header {
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .home-link {
      text-decoration: none;
      color: #000;
      font-size: 0.9rem;
      font-weight: 400; 
      position: relative;
    }

    .home-link:hover {
      text-decoration: underline;
    }

    /* 메인 인터랙션 영역 */
    .main-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start; 
      position: relative;
      padding: 10px 0 60px 0;
      cursor: crosshair;
    }

    /* 이미지 컨테이너 */
    .image-container {
      position: relative;
      width: 60%; 
      max-width: 900px;
      line-height: 0;
      z-index: 50;
    }

    .base-image {
      width: 100%;
      height: auto;
      display: block;
    }

    .image-info {
      text-align: right;
      font-size: 10px;
      color: #666;
      margin-top: 8px;
      font-weight: 300;
    }

    /* 늘어나는 이미지 박스 */
    .hover-image-box {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 10;
      border: 0.5px solid rgba(0,0,0,0.1);
    }

    .main-wrapper:hover .hover-image-box {
      opacity: 1;
    }

    .hover-image-box img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    /* 하단 푸터 */
    .footer {
      padding: 20px;
      display: flex;
      justify-content: center;
      z-index: 100;
    }

    .footer-inner {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .footer-inner a {
      color: #000;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 400;
    }

    .footer-inner a:hover {
      text-decoration: underline;
    }

    /* 클릭 시 나타나는 십자선 스타일 */
    .guide-line {
      position: fixed;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
    }

    .guide-line.v-line {
      width: 1pt;
      height: 100vh;
      top: 0;
    }

    .guide-line.h-line {
      height: 1pt;
      width: 100vw;
      left: 0;
    }

    /* 사라지는 애니메이션 (1.5초) */
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .fade-out {
      animation: fadeOut 1.5s forwards;
    }
  </style>
</head>

<body>

  <div id="v-line" class="guide-line v-line"></div>
  <div id="h-line" class="guide-line h-line"></div>

  <div class="header">
    <a href="index.html" class="home-link">장혁준 Jang Hyukjun</a>
  </div>

  <main class="main-wrapper" id="interaction-area">
    <div class="image-container" id="image-box">
      <img src="images/On-754.jpg" alt="Background" class="base-image">
      
      <div class="image-info">
        © 장혁준, Frankfurt, 2024
      </div>

      <div class="hover-image-box" id="mask">
        <img src="images/On-754.jpg" alt="Distorted View" id="mask-img">
      </div>
    </div>
  </main>

  <div class="footer">
    <div class="footer-inner">
      <a href="mailto:imjanghyukjun@gmail.com">Email</a>
      <a href="https://instagram.com/janghyukjun_/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </div>
  </div>

  <script>
    const area = document.getElementById('interaction-area');
    const imageBox = document.getElementById('image-box');
    const mask = document.getElementById('mask');
    const maskImg = document.getElementById('mask-img');
    
    const vLine = document.getElementById('v-line');
    const hLine = document.getElementById('h-line');

    // 1. 마우스 이동 및 이미지 찌그러짐 인터랙션
    area.addEventListener('mousemove', (e) => {
      const rect = imageBox.getBoundingClientRect();
      const diffX = e.clientX - rect.left;
      const diffY = e.clientY - rect.top;

      const boxWidth = Math.abs(diffX);
      const boxHeight = Math.abs(diffY);

      mask.style.width = boxWidth + 'px';
      mask.style.height = boxHeight + 'px';

      if (diffX < 0) {
        mask.style.left = diffX + 'px';
        maskImg.style.transform = 'scaleX(-1)';
      } else {
        mask.style.left = '0px';
        maskImg.style.transform = 'scaleX(1)';
      }

      if (diffY < 0) {
        mask.style.top = diffY + 'px';
        maskImg.style.transform += ' scaleY(-1)';
      } else {
        mask.style.top = '0px';
        maskImg.style.transform += ' scaleY(1)';
      }
    });

    area.addEventListener('mouseleave', () => {
      mask.style.width = '0';
      mask.style.height = '0';
    });

    // 2. 클릭 인터랙션 (색상 구분)
    window.addEventListener('mousedown', (e) => {
      const clickX = e.clientX;
      const clickY = e.clientY;

      // 버튼(A 태그) 클릭 여부에 따라 색상 변경
      const isButtonClick = e.target.tagName === 'A';
      const lineColor = isButtonClick ? 'rgb(255, 0, 0)' : 'rgb(0, 255, 0)';

      vLine.style.backgroundColor = lineColor;
      hLine.style.backgroundColor = lineColor;

      // 위치 설정
      vLine.style.left = clickX + 'px';
      hLine.style.top = clickY + 'px';

      // 애니메이션 초기화 및 실행
      vLine.classList.remove('fade-out');
      hLine.classList.remove('fade-out');
      
      void vLine.offsetWidth; // 리플로우 강제 발생
      
      vLine.classList.add('fade-out');
      hLine.classList.add('fade-out');
    });
  </script>

</body>
</html>
