<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jang Hyukjun</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      color: #000;
    }

    /* 1. 상단 제목: 중앙정렬, 폰트 통일, 현재 페이지 새로고침 */
    .header {
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .home-link {
      text-decoration: none;
      color: #000;
      font-size: 0.9rem;
      font-weight: 400; 
    }

    .home-link:hover {
      text-decoration: underline;
    }

    /* 마우스 이벤트를 감지할 전체 메인 영역 */
    .main-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 40px 0;
      /* 마우스 감지를 위해 전체 영역 사용 */
      cursor: crosshair;
    }

    /* 3. 배경 이미지: 가로 전체의 3/5 */
    .image-container {
      position: relative;
      width: 60%; 
      max-width: 900px;
      line-height: 0;
    }

    .base-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 사진 정보 기입 (우측 하단) */
    .image-info {
      text-align: right;
      font-size: 10px;
      color: #666;
      margin-top: 8px; /* 미세한 여백 */
      font-weight: 300;
    }

    /* 2. 마우스 따라 늘어나는 박스 내부의 이미지 */
    .hover-image-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .main-wrapper:hover .hover-image-box {
      opacity: 1;
    }

    .hover-image-box img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    /* 하단 푸터 */
    .footer {
      padding: 20px;
    }

    .footer-inner {
      display: flex;
      gap: 20px;
    }

    .footer-inner a {
      color: #000;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 400;
    }

    .footer-inner a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="header">
    <a href="index.html" class="home-link">장혁준 Jang Hyukjun</a>
  </div>

  <main class="main-wrapper" id="interaction-area">
    <div class="image-container" id="image-box">
      <img src="images/On-754.jpg" alt="Background" class="base-image">
      
      <div class="image-info">
        © 장혁준, Frankfurt, 2024
      </div>

      <div class="hover-image-box" id="mask">
        <img src="images/On-754.jpg" alt="Distorted View" id="mask-img">
      </div>
    </div>
  </main>

  <div class="footer">
    <div class="footer-inner">
      <a href="mailto:imjanghyukjun@gmail.com">Email</a>
      <a href="https://instagram.com/janghyukjun_/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </div>
  </div>

  <script>
    const area = document.getElementById('interaction-area');
    const imageBox = document.getElementById('image-box');
    const mask = document.getElementById('mask');
    const maskImg = document.getElementById('mask-img');

    area.addEventListener('mousemove', (e) => {
      const rect = imageBox.getBoundingClientRect();
      const windowWidth = window.innerWidth;

      // 이미지 박스의 왼쪽 상단(0,0)을 기준으로 마우스의 상대 좌표 계산
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // 1. 박스 크기 설정 (이미지 박스 크기에 상관없이 마우스 위치만큼 그려짐)
      mask.style.width = Math.max(x, 0) + 'px';
      mask.style.height = Math.max(y, 0) + 'px';

      // 2. 좌우 반전 로직: 화면 중앙보다 왼쪽에 마우스가 있으면 반전
      if (e.clientX < windowWidth / 2) {
        maskImg.style.transform = 'scaleX(-1)';
      } else {
        maskImg.style.transform = 'scaleX(1)';
      }
    });

    area.addEventListener('mouseleave', () => {
      mask.style.width = '0';
      mask.style.height = '0';
    });
  </script>

</body>
</html>
