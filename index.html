<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jang Hyukjun</title>
  <style>
    /* 기본 스타일 초기화 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      color: #000;
    }

    /* 1. 상단 제목: 중앙정렬, 하단 폰트와 통일, 홈 새로고침 */
    .header {
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .home-link {
      text-decoration: none;
      color: #000;
      /* 하단 폰트와 동일한 사이즈 및 두께 설정 */
      font-size: 0.9rem;
      font-weight: 400; 
    }

    .home-link:hover {
      text-decoration: underline;
    }

    /* 3. 배경 이미지 영역: 가로 전체의 3/5 (60%) 제한 */
    .images {
      flex: 1;
      display: flex;
      justify-content: center; /* 가로 중앙 배치 */
      align-items: flex-start;
      padding-top: 40px;
    }

    .image-container {
      position: relative;
      /* 가로 길이를 화면의 60%로 제한 */
      width: 60%; 
      max-width: 900px; /* 너무 커지는 것 방지 */
      line-height: 0;
      cursor: crosshair;
      overflow: hidden;
    }

    .base-image {
      width: 100%;
      height: auto;
      display: block;
      opacity: 1;
    }

    /* 2. 마우스 따라 움직이는 신축성 있는 이미지 박스 */
    .hover-image-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .image-container:hover .hover-image-box {
      opacity: 1;
    }

    /* '내용을 프레임에 맞춤' 효과: 프레임 크기에 맞춰 이미지 압축/확장 */
    .hover-image-box img {
      width: 100%;
      height: 100%;
      object-fit: fill; /* 박스 크기에 무조건 맞춤 (찌그러짐 발생) */
      display: block;
    }

    /* 하단 푸터 */
    .footer {
      padding: 20px;
      display: flex;
      justify-content: flex-start;
    }

    .footer-inner {
      display: flex;
      gap: 20px;
    }

    .footer-inner a {
      color: #000;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 400;
    }

    .footer-inner a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="header">
    <a href="/" class="home-link">장혁준 Jang Hyukjun</a>
  </div>

  <main class="images">
    <div class="image-container" id="container">
      <img src="images/On-754.jpg" alt="Background" class="base-image">
      
      <div class="hover-image-box" id="mask">
        <img src="images/On-754.jpg" alt="Distorted View">
      </div>
    </div>
  </main>

  <div class="footer">
    <div class="footer-inner">
      <a href="mailto:imjanghyukjun@gmail.com">Email</a>
      <a href="https://instagram.com/janghyukjun_/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </div>
  </div>

  <script>
    const container = document.getElementById('container');
    const mask = document.getElementById('mask');

    container.addEventListener('mousemove', (e) => {
      const rect = container.getBoundingClientRect();

      // 마우스 상대 좌표 계산
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // 이미지 경계 내부로 값 제한
      const width = Math.min(Math.max(x, 0), rect.width);
      const height = Math.min(Math.max(y, 0), rect.height);

      // 박스 크기를 마우스 좌표에 맞춤 -> 내부 이미지는 object-fit: fill에 의해 찌그러짐
      mask.style.width = width + 'px';
      mask.style.height = height + 'px';
    });

    container.addEventListener('mouseleave', () => {
      mask.style.width = '0';
      mask.style.height = '0';
    });
  </script>

</body>
</html>
